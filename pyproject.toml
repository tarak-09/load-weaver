[project]
name = "omniload"
version = "0.1.0"
description = "A concurrent HTTP load generator that mitigates coordinated omission."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "aiohttp>=3.9.0",
    "numpy>=1.24.0"
]

[project.scripts]
omniload = "omniload.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "aioresponses>=0.7.6"
]
